name: jackedlog
description: Track gym progress, visualize graphs, enjoy offline support & timers
publish_to: none
version: 1.1.1+1
environment:
  sdk: ">=3.2.6 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Database
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.4.0
  # State Management
  flutter_bloc: ^8.1.6
  provider: ^6.1.1
  get_it: ^7.7.0
  equatable: ^2.0.5
  # Navigation
  go_router: ^14.6.2
  # Utilities
  path_provider: ^2.1.2
  path: ^1.8.3
  csv: ^6.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  # UI
  fl_chart: ^1.0.0
  dynamic_color: ^1.7.0
  badges: ^3.1.2
  timeago: ^3.2.2
  rive: ^0.13.18
  palette_generator: ^0.3.3
  video_player: ^2.8.2
  # Platform
  permission_handler: ^12.0.1
  file_picker: ^10.2.0
  image_picker: ^1.0.7
  share_plus: ^11.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6
  http: ^1.2.0
  flutter_local_notifications: ^19.3.0
  archive: ^4.0.0
  # Audio/Spotify
  spotify_sdk: ^3.0.0
  audioplayers: ^6.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  drift_dev: ^2.28.1
  build_runner: ^2.6.0
  flutter_launcher_icons: ^0.14.2
flutter:
  uses-material-design: true
  assets:
    - assets/
    - exercise-assets/
    - exercise-assets/images/
    - exercise-assets/videos/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "screenshots/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "screenshots/app_icon.png"
